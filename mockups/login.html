<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mockup — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/maqueta.css">
</head>
<body class="login-page">
  <div class="mock-banner"><strong>MOCKUP</strong> · <a href="index.html" style="color:#b8dcc8">← Catálogo</a></div>
  <div class="top-strip">
    <span>Gobierno del <b>Estado de México</b></span>
    <span>gob.mx · Registro Civil 03</span>
  </div>
  <div class="login-wrap">
    <div class="login-card">
      <aside class="login-aside">
        <div class="crest">RC</div>
        <h1>Registro Civil</h1>
        <p>Oficialía 03 · Sistema interno de gestión de citas</p>
      </aside>
      <main class="login-main">
        <div class="login-form">
          <h2>Iniciar sesión</h2>
          <div class="field"><label>Usuario</label><input type="text" placeholder="Usuario" disabled></div>
          <div class="field"><label>Contraseña</label><input type="password" placeholder="Contraseña" disabled></div>
          <button type="button" class="btn-login" disabled>Iniciar sesión</button>
          <p style="text-align:center;margin-top:20px;font-size:11.5px;color:var(--tinta-tenue)">Acceso restringido al personal autorizado</p>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
