databases:
  - name: registro-civil-db
    plan: free
    databaseName: registro_civil
    user: registro_civil

services:
  - type: web
    name: registro-civil-03
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "python manage.py migrate --no-input && python manage.py seed_initial_data && gunicorn core_rc.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: registro-civil-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: WEB_CONCURRENCY
        value: 2
      - key: GROK_API_KEY
        sync: false
      - key: PII_ENCRYPTION_KEYS
        sync: false
      - key: PII_ACTIVE_KEY_VERSION
        sync: false
      - key: PII_BLIND_INDEX_KEY
        sync: false
